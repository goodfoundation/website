title: Good Software Foundation
tagline: Software built for people, not for profit
description: >-
  The Good Software Foundation is a non-profit that funds, maintains and
  stewards open source software that serves the public good.

# The public site and local preview are both served from the domain root.
url: "https://goodfoundation.github.io"
baseurl: ""

email: contact@goodsoftware.foundation
github_org: goodfoundation

logo: /assets/gsf-logo-white-bg.png
image: /assets/good-software-foundation-text.png

social:
  - name: GitHub
    url: https://github.com/goodfoundation
  - name: Email
    url: mailto:contact@goodsoftware.foundation

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - serve.sh
  - vendor
  - .github
