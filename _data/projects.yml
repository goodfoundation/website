    it, and the audit trail is readable by humans.
  tags: [Rust, FHIR, Privacy]
  links:
    - label: Visit website
      url: "#"
      primary: true
    - label: Source
      url: https://github.com/goodfoundation

- name: Commons Maps
  tagline: Community mapping without surveillance
  icon: map
