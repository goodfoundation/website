- name: Open Ledger
  tagline: Transparent finances for non-profits
  icon: ledger
  status: Active
  description: >-
    A double-entry bookkeeping platform purpose-built for charities and
    community organisations, so every donation can be traced from pledge to
    impact without an accounting degree.
  tags: [TypeScript, Postgres, Self-hosted]
  links:
    - label: Visit website
      url: "#"
      primary: true
    - label: Source
      url: https://github.com/goodfoundation

- name: Quiet Mail
  tagline: Private, spam-free email for small teams
  icon: mail
  status: Active
  description: >-
    An end-to-end encrypted mail stack that a two-person non-profit can run on a
    single server. No tracking pixels, no data mining, no surprises in the
    terms of service.
  tags: [Go, IMAP, Encryption]
  links:
    - label: Visit website
      url: "#"
      primary: true
    - label: Source
      url: https://github.com/goodfoundation

- name: Atlas Learn
  tagline: An offline-first classroom in a box
  icon: book
  status: Incubating
  description: >-
    Curriculum, assessments and progress tracking that keep working when the
    network does not. Built with teachers in low-connectivity regions, and
    translated by the communities that use it.
  tags: [Offline-first, PWA, i18n]
  links:
    - label: Visit website
      url: "#"
      primary: true
    - label: Source
      url: https://github.com/goodfoundation

- name: Signal Health
  tagline: Clinical record keeping for community clinics
  icon: heart
  status: Active
  description: >-
    A lightweight electronic health record designed for clinics with limited
